name: Record visual baselines

# Pixel baselines depend on the OS's fonts and rendering, so CI needs its own. Run this from the Actions tab (or
# `gh workflow run visual-baselines.yml --ref <branch>`) after an intended visual change, download the
# `visual-baselines-linux` artifact, copy its PNGs into e2e/visual.spec.ts-snapshots/ and commit them in the pull
# request. It records in the same image and on the same architecture as CI's `visual` job and
# `pnpm test:visual:linux`, so all three render alike.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      # The image's Node has no corepack; install the pnpm version package.json pins.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:visual --update-snapshots=all
        env:
          E2E_SERVER: production
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
