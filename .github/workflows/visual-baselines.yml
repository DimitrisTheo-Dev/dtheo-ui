name: Record visual baselines

# Pixel baselines depend on the OS's fonts and rendering, so CI needs its own. Run this from the Actions tab (or
# `gh workflow run visual-baselines.yml`) after an intended visual change, download the `visual-baselines-linux`
# artifact, copy its PNGs into e2e/visual.spec.ts-snapshots/ and commit them in a pull request. CI's visual step
# turns on as soon as they exist.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:visual --update-snapshots
        env:
          E2E_SERVER: production
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
