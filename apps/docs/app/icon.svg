<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The orbit mark on a graphite tile. Colors are the graphite dark tokens (background, foreground, chart-1, chart-4). -->
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="90%">
      <stop offset="0" stop-color="#b07be6" stop-opacity="0.5" />
      <stop offset="1" stop-color="#b07be6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#161719" />
  <rect width="32" height="32" rx="7.5" fill="url(#glow)" />
  <g transform="translate(4 4)">
    <circle cx="12" cy="12" r="10.25" fill="none" stroke="#eff0f1" stroke-opacity="0.3" stroke-width="1.1" />
    <circle cx="7" cy="12" r="2.9" fill="#eff0f1" />
    <circle cx="17.6" cy="12" r="1.3" fill="#eff0f1" fill-opacity="0.75" />
    <circle cx="12.3" cy="3.35" r="1.6" fill="#439bf7" />
    <circle cx="12.3" cy="20.65" r="1.6" fill="#439bf7" />
  </g>
</svg>
